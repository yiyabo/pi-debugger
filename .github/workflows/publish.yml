---
name: Publish to npm

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install debugpy
        run: python -m pip install --upgrade pip debugpy

      - name: Install dev dependencies & run full checks
        run: |
          npm install
          npm run check

      - name: Upgrade npm CLI for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Publish public pi-package to npm (idempotent)
        run: |
          PKG_VER=$(npm pkg get version | tr -d '"')
          if npm view "pi-debugger@${PKG_VER}" version >/dev/null 2>&1; then
            echo "pi-debugger@${PKG_VER} already published — skipping."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
